<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>ألعاب النطق</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
<style>.doors{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));perspective:1200px}
.frame{aspect-ratio:3/5;border-radius:20px 20px 6px 6px;background:var(--card);border:6px solid #8b5a2b;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.inside{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#fff7e0,#ffe6b8);color:#3b2f25}
.inside .e{font-size:64px}.inside .t{font-weight:800;font-size:22px}
.door{position:absolute;inset:0;transform-origin:right center;transition:transform .9s cubic-bezier(.3,.8,.3,1);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-family:'Baloo Bhaijaan 2';font-weight:800;font-size:40px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.door::before{content:"";position:absolute;inset:10px;border:4px solid rgba(255,255,255,.25);border-radius:12px}
.door::after{content:"";position:absolute;left:14px;top:50%;width:16px;height:16px;border-radius:50%;background:#ffd166;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.frame.open .door{transform:rotateY(-105deg)}
.door.k{animation:knk .3s 2}
@keyframes knk{50%{transform:translateX(-4px)}}
.top{display:flex;justify-content:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;font-weight:800}
</style></head><body>
<main><div class="top"><span>🚪 الأبواب المفتوحة: <b id="cnt">0</b> / <b id="tot">0</b></span><button class="ghost" id="pickBtn">📝 تغيير الكلمات</button><button class="ghost" id="again">🔁 أغلق الأبواب</button></div>
<div class="doors" id="doors"></div></main>

<script src="assets/common.js"></script>
<script>KV.header({title:"طق طق! مين؟",sub:"اطرق الباب لتكتشف الكلمة المخفية",icon:"🚪"});
const {$}=KV;let words=[],opened=0;const COLORS=["#c0392b","#2f8f83","#7d6bd6","#e2683c","#3d9ad1","#8cb369","#e76f9a","#b7791f"];
function build(){KV.hideResume();opened=0;$("cnt").textContent=0;$("tot").textContent=words.length;
 const ws=KV.shuffle(words);
 $("doors").innerHTML=ws.map((w,i)=>`<div class="frame" data-i="${i}"><div class="inside"><span class="e">${w.e}</span><span class="t">${w.w}</span></div><div class="door" style="background:${COLORS[i%8]}">${i+1}<span style="font-size:28px">✊</span></div></div>`).join("");
 $("doors").querySelectorAll(".frame").forEach(f=>f.querySelector(".door").onclick=()=>{
  if(f.classList.contains("open"))return;const d=f.querySelector(".door"),w=ws[+f.dataset.i];
  d.classList.add("k");KV.sfx.knock();
  setTimeout(()=>{f.classList.add("open");KV.sfx.star();KV.addStar();opened++;$("cnt").textContent=opened;
   const last=opened===words.length;
   setTimeout(()=>{if(last){KV.confetti();KV.sfx.win();}
    KV.popup({emoji:w.e,title:last?"🎉 فتحت كل الأبواب!":"🚪 مين ورا الباب؟",text:w.w,sub:"قل الكلمة، ثم قل جملة فيها 🗣️",nextLabel:last?"🔁 العب مرة أخرى":"الباب التالي ←",onNext:last?build:()=>{},onClose:last?undefined:()=>{}});},700);
  },650);});}
const pick=()=>KV.wordPicker({key:"knock",min:1,max:8,onDone:w=>{words=w;build();}});
$("pickBtn").onclick=pick;$("again").onclick=build;
const s=KV.savedWords("knock");if(s){words=s.sel;build();}else pick();KV.bumpPlay("knock");
</script>
</body></html>
