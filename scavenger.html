<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>ألعاب النطق</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
<style>.wrap{display:grid;grid-template-columns:1fr 280px;gap:18px}@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.scene{border-radius:26px;padding:16px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;box-shadow:var(--shadow);border:3px solid var(--line)}
.tile{aspect-ratio:1;border-radius:16px;font-size:clamp(28px,5vw,46px);display:grid;place-items:center;background:rgba(255,255,255,.25);transition:.25s}
.tile:hover{transform:scale(1.08) rotate(-3deg);background:rgba(255,255,255,.45)}
.tile.lift{transform:translateY(-10px) rotate(-12deg)}
.tile.empty{opacity:.35}.tile.found{background:#fff;box-shadow:0 0 0 4px var(--good)}
.list .it{display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;background:var(--bg1);margin-bottom:6px;font-weight:800;font-size:18px;border:2px solid var(--line)}
.list .it.ok{background:#e3f6ea;border-color:var(--good);color:#1d5b38;text-decoration:line-through}
.list .it .e{font-size:28px}
</style></head><body>
<main>
<div class="row" id="scenes" style="margin-bottom:12px"></div>
<div class="wrap"><div class="scene" id="scene"></div>
<div class="panel list"><h3 style="margin-bottom:8px">🔎 ابحث عن: <span class="muted" id="fc"></span></h3><div id="list"></div>
<div class="row" style="margin-top:12px"><button class="ghost" id="pickBtn">📝 تغيير الكلمات</button><button class="ghost" id="again">🔁 خبّئها من جديد</button></div></div></div></main>

<script src="assets/common.js"></script>
<script>KV.header({title:"البحث عن الكنز",sub:"الكلمات مخبأة في المشهد… هل تجدها؟",icon:"🔎"});
const {$}=KV;
const SCENES={garden:{n:"الحديقة 🌳",bg:"linear-gradient(#bfe6ff,#9fd89a)",items:["🌳","🌷","🌻","🪨","🌿","🍄","🌲","🪵","🌼","🌾"]},sea:{n:"البحر 🌊",bg:"linear-gradient(#7fd3ff,#2a7fc1)",items:["🪸","🐚","🌊","🪨","🫧","🌿","⚓","🦀","🐠","🪼"]},space:{n:"الفضاء 🚀",bg:"linear-gradient(#1b1440,#3b2a7a)",items:["⭐","🪐","☄️","🌙","✨","🛰️","🌑","💫","🌍","🛸"]},house:{n:"البيت 🏠",bg:"linear-gradient(#ffe8cc,#f5c99b)",items:["🛋️","🪑","🖼️","🪴","🧸","📚","🕰️","🧺","🛏️","🪟"]}};
let sc="garden",words=[],found=0,map=[];
$("scenes").innerHTML=Object.entries(SCENES).map(([k,v])=>`<button class="ghost" data-k="${k}">${v.n}</button>`).join("");
$("scenes").querySelectorAll("button").forEach(b=>b.onclick=()=>{sc=b.dataset.k;start(words);});
function hide(){KV.hideResume();const S=SCENES[sc];found=0;$("scene").style.background=S.bg;const N=30;
 const spots=KV.shuffle([...Array(N).keys()]).slice(0,words.length);map=Array(N).fill(null);spots.forEach((s,i)=>map[s]=words[i]);
 $("scene").innerHTML=map.map((_,i)=>`<button class="tile" data-i="${i}">${KV.pick(S.items)}</button>`).join("");
 $("scene").querySelectorAll(".tile").forEach(t=>t.onclick=()=>look(t));renderList();}
function renderList(){$("fc").textContent=`${found} / ${words.length}`;$("list").innerHTML=words.map(w=>`<div class="it ${w._f?"ok":""}"><span class="e">${w._f?w.e:"❔"}</span>${w.w}</div>`).join("");}
function look(t){if(t.classList.contains("found")||t.classList.contains("empty"))return;const w=map[+t.dataset.i];t.classList.add("lift");KV.sfx.flip();
 setTimeout(()=>{t.classList.remove("lift");
  if(!w){t.classList.add("empty");KV.toast("لا يوجد شيء هنا… ابحث مرة أخرى 👀");return;}
  t.textContent=w.e;t.classList.add("found");w._f=true;found++;renderList();KV.sfx.star();KV.addStar();const last=found===words.length;if(last){KV.confetti();KV.sfx.win();}
  KV.popup({emoji:w.e,title:last?"🏆 وجدت كل الكنوز!":"🎉 وجدت كنزًا!",text:w.w,sub:"قل الكلمة، ثم قل أين وجدتها 🗣️",nextLabel:last?"🔁 العب مرة أخرى":"تابع البحث ←",onNext:last?()=>start(words):()=>{},onClose:last?undefined:()=>{}});},350);}
const start=w=>{words=w.map(x=>({...x,_f:false}));hide();};
const pick=()=>KV.wordPicker({key:"scav",min:1,max:8,onDone:start});
$("pickBtn").onclick=pick;$("again").onclick=()=>start(words);
const s=KV.savedWords("scav");if(s)start(s.sel);else pick();KV.bumpPlay("scavenger");
</script>
</body></html>
