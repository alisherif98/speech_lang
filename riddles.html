<main><div id="qz"></div></main>

<script src="assets/common.js"></script>
<script>KV.header({title:"من أنا؟",sub:"ألغاز ووصف – استمع للصفات وخمّن",icon:"🕵️"});
const R=[["🐘","فيل","أنا حيوان كبير جدًا، لوني رمادي، ولي خرطوم طويل. من أنا؟"],["🦒","زرافة","أنا حيوان رقبتي طويلة جدًا، وآكل أوراق الشجر العالية. من أنا؟"],["🐝","نحلة","أنا حشرة صغيرة، أطير بين الأزهار، وأصنع العسل. من أنا؟"],["🍌","موزة","أنا فاكهة صفراء وطويلة، يحبني القرد. من أنا؟"],["☂️","مظلة","نفتحني عندما تمطر حتى لا نبتل. من أنا؟"],["🪥","فرشاة أسنان","نستخدمني كل صباح ومساء لننظف أسناننا. من أنا؟"],["🌙","قمر","أظهر في السماء في الليل، وأكون أحيانًا هلالًا. من أنا؟"],["🐟","سمكة","أعيش في الماء، ليس لي أرجل، وأسبح بزعانفي. من أنا؟"],["🚒","سيارة إطفاء","أنا سيارة حمراء، لي صوت عالٍ، وأذهب لإطفاء الحريق. من أنا؟"],["🍉","بطيخة","أنا فاكهة كبيرة، خضراء من الخارج وحمراء من الداخل. من أنا؟"],["🛏️","سرير","ننام عليّ في الليل، ولي وسادة وغطاء. من أنا؟"],["🐄","بقرة","أعيش في المزرعة، وأعطيكم الحليب. من أنا؟"],["⚽","كرة","أنا مستديرة، يركلني الأطفال في الملعب. من أنا؟"],["🧊","ثلاجة","أحفظ الطعام باردًا في المطبخ. من أنا؟"],["🐢","سلحفاة","أمشي ببطء شديد، وأحمل بيتي على ظهري. من أنا؟"],["✈️","طائرة","أطير في السماء وأحمل الناس من بلد إلى بلد. من أنا؟"]];
KV.quiz({make:()=>KV.shuffle(R).slice(0,10).map(r=>({pic:"❓",small:true,q:r[2],choices:KV.shuffle([{e:r[0],t:r[1],ok:true},...KV.shuffle(R.filter(x=>x!==r)).slice(0,2).map(x=>({e:x[0],t:x[1],ok:false}))]),ans:`أنا ${r[1]}!`,ansEmoji:r[0],sub:"الآن صِف أنت شيئًا ودع غيرك يخمّن 💬"}))});
KV.bumpPlay("riddles");
</script>
