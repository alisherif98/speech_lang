<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ألعاب النطق</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
<style></style></head><body>
<main><div id="qz"></div></main>

<script src="assets/common.js"></script>
<script>KV.header({title:"الأضداد",sub:"ما عكس هذه الكلمة؟",icon:"↔️"});
const D=[["🐘","كبير","🐜","صغير"],["🔥","حار","🧊","بارد"],["☀️","نهار","🌙","ليل"],["😀","سعيد","😢","حزين"],["🐇","سريع","🐢","بطيء"],["🦒","طويل","🐁","قصير"],["💡","مضيء","🌑","مظلم"],["🚪","مفتوح","🔒","مغلق"],["🧼","نظيف","💩","متسخ"],["⬆️","فوق","⬇️","تحت"],["🍽️","ممتلئ","🫙","فارغ"],["🍬","حلو","🍋","حامض"],["🌊","مبلل","🏜️","جاف"],["🏋️","ثقيل","🪶","خفيف"],["🔊","عالٍ","🔈","منخفض"],["👴","كبير في السن","👶","صغير في السن"],["🌝","قريب","🔭","بعيد"],["🌅","يصعد","🌇","ينزل"],["🏃","يدخل","🚶","يخرج"],["🥵","صيف","🥶","شتاء"]];
KV.quiz({make:()=>KV.shuffle(D).slice(0,10).map(c=>{const flip=Math.random()<.5,[e1,w1,e2,w2]=flip?[c[2],c[3],c[0],c[1]]:c;
 const ds=KV.shuffle(D.filter(x=>x!==c)).slice(0,2).map(x=>Math.random()<.5?{e:x[0],t:x[1]}:{e:x[2],t:x[3]});
 return{pic:e1,q:`ما عكس «${w1}»؟`,choices:KV.shuffle([{e:e2,t:w2,ok:true},...ds.map(d=>({...d,ok:false}))]),ans:`عكس ${w1} هو ${w2}`,ansEmoji:e1+" ↔️ "+e2,sub:"قل الكلمتين معًا 🗣️"};})});
KV.bumpPlay("opposites");
</script>
</body></html>
